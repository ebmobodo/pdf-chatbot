name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff check
        run: ruff check .

      - name: Ruff format (check only)
        run: ruff format --check .

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Mypy
        run: mypy src/

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest with coverage
        run: pytest -v --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  build:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t pdf-chatbot:${{ github.sha }} .

      - name: Smoke test container start
        run: |
          docker run -d --name pdf-chatbot-smoke -p 8500:8500 \
            -e PORT=8500 \
            -e GOOGLE_API_KEY=ci-placeholder \
            -e NVIDIA_API_KEY=ci-placeholder \
            -e SUPABASE_URL=https://placeholder.supabase.co \
            -e SUPABASE_SERVICE_KEY=ci-placeholder \
            pdf-chatbot:${{ github.sha }}
          # Give the health check a chance to register
          sleep 30
          docker logs pdf-chatbot-smoke
          # Container must still be running (config errors crash at startup)
          docker ps --filter name=pdf-chatbot-smoke --format '{{.Status}}' | grep -q 'Up'
          docker rm -f pdf-chatbot-smoke

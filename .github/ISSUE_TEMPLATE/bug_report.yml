name: Bug report
description: Report a bug or unexpected behavior in PDF Chat Bot
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report. Please be
        as detailed as possible. **Do not** report security vulnerabilities
        here — use [SECURITY.md](../../SECURITY.md) instead.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
      placeholder: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps to trigger the bug.
      placeholder: |
        1. Upload a PDF with...
        2. Ask "..." in the chat
        3. See the error...
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the app is affected?
      options:
        - PDF upload / processing (Docling)
        - OCR fallback
        - Vector store / Supabase
        - LLM / Gemini chain
        - Configuration / environment
        - Deployment (Docker / Render)
        - Other
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Python version, Streamlit version, and how you ran the app.
      placeholder: "e.g. Linux, Python 3.12, streamlit 1.59, docker"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste any error messages, stack traces, or log snippets.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues to make sure this isn't a duplicate.
          required: true

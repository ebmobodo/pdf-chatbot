services:
  - type: web
    name: pdf-chatbot
    runtime: docker
    envVars:
      - key: PORT
        value: 8500
      - key: GOOGLE_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
    healthCheckPath: /_stcore/health
    plan: free
    dockerContext: .
    dockerfilePath: ./Dockerfile